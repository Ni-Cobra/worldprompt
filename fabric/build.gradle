plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Bundled (about 12 KB) so LuckPerms or any other permissions mod can grant /wp nodes.
    include(implementation("me.lucko:fabric-permissions-api:${project.fabric_permissions_api_version}"))
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'dev/worldprompt/version.txt']) { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar {
    from('../LICENSE') { rename { 'LICENSE_worldprompt' } }
}
test { useJUnitPlatform() }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'worldprompt-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

// The block-registry GameTest compares the live game against Core's bundled schema.
loom {
    runs {
        configureEach {
            if (name == 'gameTest') property 'worldprompt.schemas', file('../src/worldprompt_core/schemas').absolutePath
        }
    }
}
