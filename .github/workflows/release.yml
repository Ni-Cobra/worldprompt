name: Release

# Core and the mod are the two independently versioned components:
#   core-v1.1.0     builds the Windows bundle, Linux bundle and wheel
#   fabric-v1.1.0   builds the Fabric mod jar
#   neoforge-v1.1.0 builds the NeoForge mod jar
# Fabric and NeoForge are one component. They share fabric/gradle.properties, so they
# always carry the same version, and they are released together: push both loader tags at
# the same version, on the same commit. The job below holds that — a loader tag whose
# sibling exists elsewhere, or at another version, fails rather than shipping half a release.
# The tag must match the version in the source at the tagged commit. Review the
# draft release and its notes on GitHub, then publish it.
on:
  push:
    tags: ['core-v*', 'fabric-v*', 'neoforge-v*']

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag against the source version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^(core|fabric|neoforge)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' must look like core-vX.Y.Z , fabric-vX.Y.Z or neoforge-vX.Y.Z."
            exit 1
          fi
          component="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          if [ "$component" = core ]; then
            py=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
            init=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/worldprompt_core/__init__.py)
            if [ "$py" != "$version" ] || [ "$init" != "$version" ]; then
              echo "::error::Tag $TAG does not match Core's source (pyproject.toml $py, __init__.py $init)."
              exit 1
            fi
          else
            mod=$(sed -n 's/^version=//p' fabric/gradle.properties)
            if [ "$mod" != "$version" ]; then
              echo "::error::Tag $TAG does not match fabric/gradle.properties ($mod)."
              exit 1
            fi
            # Fabric and NeoForge are one component, released together from one commit.
            # The sibling tag may not exist yet (whichever is pushed first), but if it does
            # it must name this same version and the same commit.
            if [ "$component" = fabric ]; then sibling=neoforge; else sibling=fabric; fi
            if git rev-parse -q --verify "refs/tags/$sibling-v$version" >/dev/null; then
              here=$(git rev-list -n 1 "refs/tags/$TAG")
              there=$(git rev-list -n 1 "refs/tags/$sibling-v$version")
              if [ "$here" != "$there" ]; then
                echo "::error::$TAG and $sibling-v$version are on different commits; the mod's loaders release together."
                exit 1
              fi
            fi
            for other in $(git tag --list "$sibling-v*"); do
              if [ "${other#$sibling-v}" != "$version" ] \
                 && [ "$(git rev-list -n 1 "refs/tags/$other")" = "$(git rev-list -n 1 "refs/tags/$TAG")" ]; then
                echo "::error::This commit is already tagged $other; both loaders must carry version $version."
                exit 1
              fi
            done
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      components: ${{ needs.plan.outputs.component }}

  publish:
    needs: [plan, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: worldprompt-${{ needs.plan.outputs.component }}*
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMPONENT: ${{ needs.plan.outputs.component }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd release
          # Every file must belong to this tag's component and version.
          if [ "$COMPONENT" = core ]; then
            allowed='^(WorldPrompt-Core-VERSION-(linux|windows)-x86_64\.(tar\.gz|zip)|worldprompt_core-VERSION-.*\.whl)$'
            title="WorldPrompt Core $VERSION"
          elif [ "$COMPONENT" = neoforge ]; then
            allowed='^worldprompt-neoforge-VERSION\.jar$'
            title="WorldPrompt NeoForge mod $VERSION"
          else
            allowed='^worldprompt-fabric-VERSION\.jar$'
            title="WorldPrompt Fabric mod $VERSION"
          fi
          allowed="${allowed//VERSION/${VERSION//./\\.}}"
          for file in *; do
            if [[ ! "$file" =~ $allowed ]]; then
              echo "::error::Unexpected release file '$file' for $TAG."
              exit 1
            fi
          done
          sha256sum -- * > SHA256SUMS.txt
          ls -la
          # Notes cover changes since the previous release of the same component only.
          previous=$(git tag --list "${COMPONENT}-v*" --sort=-v:refname | grep -vx -- "$TAG" | head -n 1 || true)
          notes=()
          if [ -n "$previous" ]; then notes=(--notes-start-tag "$previous"); fi
          gh release create "$TAG" --draft --verify-tag \
            --title "$title" --generate-notes "${notes[@]}" -- *
